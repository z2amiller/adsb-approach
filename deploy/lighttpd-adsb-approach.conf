# Template: install.sh fills in the @...@ values and writes the result to /etc/lighttpd/conf-available/89-adsb-approach.conf. Edit this file, not the installed copy.
# adsb-approach web page at /adsb-approaches/, proxied to adsb-approach-web on 127.0.0.1:@PORT@
url.redirect += ( "^/adsb-approaches$" => "/adsb-approaches/" )
$HTTP["url"] =~ "^/adsb-approaches/" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => @PORT@ ) ) )
    proxy.header = ( "map-urlpath" => ( "/adsb-approaches/" => "/" ) )
    server.stream-response-body = 2    # pass the live event stream through unbuffered
}
