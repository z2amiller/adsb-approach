source = "SFO VOR R-095 inbound (292.0T, declination 17E); turn at 5.0 nm and join at 1.1 nm hand-fitted to 7,299 flights matched to the radial, 2026-09-13..10-23; fit-path on the same days gives 5.75 nm and 1.0 nm from 7,114 flights, within 125 ft"
points = [
