[project]
name = "adsb-approach"
version = "0.1.0"
description = "Live approach-deviation and go-around monitor for a readsb ADS-B receiver"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.11",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[project.scripts]
adsb-approach = "adsb_approach.cli:main"

[build-system]
requires = ["setuptools>=77"]                  # PEP 639: license = "MIT" as an SPDX expression
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adsb_approach*"]

[tool.setuptools.package-data]
"adsb_approach.store" = ["migrations/*.sql"]
"adsb_approach.web" = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Development pins the versions Ubuntu 26.04 packages (python3-fastapi and friends, Python 3.14), the platform the
# author's collector runs on, so the tests run what a systemd install from that distribution's packages runs.
constraint-dependencies = [
    "fastapi==0.118.0", "starlette==0.50.0", "uvicorn==0.38.0", "pydantic==2.12.5", "pydantic-core==2.41.5",
    "anyio==4.11.0", "h11==0.14.0", "click==8.1.8", "typing-extensions==4.15.0", "annotated-types==0.7.0",
    "typing-inspection==0.4.2", "httpx==0.28.1",
]
# Ubuntu ships starlette 0.50.0 with fastapi 0.118.0, past the <0.49 bound fastapi's own metadata declares; this does
# the same, so the tests run the combination Ubuntu ships.
override-dependencies = ["starlette==0.50.0"]
